<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OSINT PRO — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:44px 36px;max-width:400px;width:100%;backdrop-filter:blur(20px)}
.card h1{font-size:26px;font-weight:900;text-align:center;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .sub{text-align:center;color:rgba(255,255,255,0.25);margin:6px 0 28px;font-size:14px}
.flash{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.1);border-radius:12px;padding:10px 14px;color:#ef4444;margin-bottom:16px;text-align:center;font-size:14px}
.flash.success{background:rgba(16,185,129,0.06);border-color:rgba(16,185,129,0.1);color:#10b981}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:rgba(255,255,255,0.35);margin-bottom:4px;font-weight:500}
.form-group input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;color:#fff;font-size:15px;outline:none;font-family:'Inter',sans-serif;transition:border .2s}
.form-group input:focus{border-color:rgba(124,58,237,0.3)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .3s;font-family:'Inter',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,0.2)}
.link{text-align:center;margin-top:14px;color:rgba(255,255,255,0.2);font-size:14px}
.link a{color:#a78bfa;text-decoration:none}
</style>
</head>
<body>
<div class="card">
    <h1>🔍 OSINT PRO</h1>
    <p class="sub">Create your account</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in msgs %}
            <div class="flash {{ 'success' if cat == 'success' else '' }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <div class="form-group"><label>Full Name</label><input type="text" name="full_name" placeholder="John Doe" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Min 6 characters" required minlength="6"></div>
        <button type="submit" class="btn">Register</button>
    </form>
    <div class="link">Already have an account? <a href="/login">Login</a></div>
</div>
</body>
</html>
